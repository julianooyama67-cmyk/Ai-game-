<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temple Dash</title>
<style>
:root{--bg:#1b1030;--panel:#fff3dc;--ink:#2e1a0c;--btn:#d9552b;--btn-ink:#fff8ec;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:#2c1a3f;--ink:#fbe9cc;--btn:#f0a43c;--btn-ink:#2a1608;}}
:root[data-theme="dark"]{--panel:#2c1a3f;--ink:#fbe9cc;--btn:#f0a43c;--btn-ink:#2a1608;}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;font-family:Georgia,"Times New Roman",serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;display:flex;justify-content:space-between;color:#fff;font-weight:700;font-size:22px;text-shadow:0 2px 6px #000a;pointer-events:none}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;padding:20px;box-sizing:border-box}
.ov[hidden]{display:none}
.card{background:var(--panel);color:var(--ink);border-radius:18px;padding:26px 24px;max-width:330px;text-align:center;border:3px solid var(--btn)}
h1,h2{margin:0 0 10px;font-size:34px;line-height:1.1}
h2{font-size:28px}
p{margin:0 0 18px;line-height:1.5;font-size:17px}
button{font:inherit;font-size:20px;font-weight:700;background:var(--btn);color:var(--btn-ink);border:0;border-radius:12px;padding:12px 30px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">0 m</span><span id="co">🪙 0</span></div>
<div class="ov" id="menu"><div class="card"><h1>Temple Dash</h1><p>Run through the ruins. Swipe left or right to change lanes, up to jump, down to slide. On a keyboard, use arrows or WASD.</p><button id="go">Start running</button></div></div>
<div class="ov" id="over" hidden><div class="card"><h2>You stumbled</h2><p id="res"></p><button id="again">Run again</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const Z0=3,ZF=42;
let W,H,S,HY,CAMH,F;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(.2*H,W*.3);HY=H*.3;CAMH=(H*.8-HY)/S;F=S*Z0}
addEventListener('resize',resize);resize();

let st='menu',dist=0,speed=9,lane=0,px=0,py=0,vy=0,slide=0,coins=0,objs=[],nextSpawn=18,runT=0,camX=0,best=0,time=0;
try{best=+localStorage.getItem('tdBest')||0}catch(e){}

function reset(){dist=0;speed=9;lane=0;px=0;py=0;vy=0;slide=0;coins=0;objs=[];nextSpawn=18}
function start(){reset();st='play';$('menu').hidden=true;$('over').hidden=true}
$('go').onclick=start;$('again').onclick=start;

function spawn(){
  const z=nextSpawn,r=Math.random(),L=()=>Math.floor(Math.random()*3)-1;
  if(r<.3){const a=L();objs.push({t:'block',l:a,z});if(Math.random()<.5){const b=L();if(b!==a)objs.push({t:'block',l:b,z})}
    objs.push({t:'coin',l:a===0?1:0,z:z+.3,h:.6})}
  else if(r<.5){objs.push({t:'beam',z});const l=L();for(let i=0;i<4;i++)objs.push({t:'coin',l,z:z-3+i*.9,h:.6})}
  else if(r<.65){const gz=Math.round(z);objs.push({t:'gap',z:gz,len:3});
    for(let i=0;i<5;i++)objs.push({t:'coin',l:0,z:gz-.2+i*.75,h:.7+Math.sin(i/4*Math.PI)*.9})}
  else{const l=L();for(let i=0;i<7;i++)objs.push({t:'coin',l,z:z+i*.9,h:.6})}
  nextSpawn+=10+speed*.55+Math.random()*5;
}
function crash(){
  st='over';
  const sc=Math.floor(dist)+coins*10;
  if(sc>best){best=sc;try{localStorage.setItem('tdBest',best)}catch(e){}}
  $('res').textContent='Score '+sc+' · Best '+best+' · '+Math.floor(dist)+' m, '+coins+' coins';
  setTimeout(()=>{if(st==='over')$('over').hidden=false},450);
}
function update(dt){
  runT+=dt*(8+speed*.6);
  if(st==='menu'){dist+=6*dt;camX+=(0-camX)*.1;return}
  if(st!=='play')return;
  speed=Math.min(18,9+dist*.006);
  dist+=speed*dt;
  while(nextSpawn<dist+ZF)spawn();
  px+=(lane-px)*Math.min(1,dt*12);
  camX=px*.5;
  if(py>0||vy!==0){vy-=26*dt;py+=vy*dt;if(py<=0){py=0;vy=0}}
  if(slide>0)slide-=dt;
  for(const o of objs){
    const rel=o.z-dist;
    if(rel>2||rel<-4)continue;
    if(o.t==='block'){if(Math.abs(px-o.l)<.6&&rel<.3&&rel>-.7&&py<.85)return crash()}
    else if(o.t==='beam'){if(rel<.2&&rel>-.3&&!(slide>0&&py<.3))return crash()}
    else if(o.t==='gap'){if(rel<-.2&&rel>-(o.len-.2)&&py<.15)return crash()}
    else if(o.t==='coin'&&!o.got){if(Math.abs(px-o.l)<.7&&Math.abs(rel)<.6&&Math.abs(py+.8-o.h)<1){o.got=1;coins++}}
  }
  objs=objs.filter(o=>o.z-dist>-8);
}

function P(x,y,z){const s=F/(z+Z0);return[W/2+(x-camX)*s,HY+(CAMH-y)*s,s]}
function poly(p,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();ctx.fill()}
function strip(x1,x2,z1,z2,col){poly([P(x1,0,z1),P(x2,0,z1),P(x2,0,z2),P(x1,0,z2)],col)}
function rectP(x1,y1,x2,y2,z,col){const a=P(x1,y2,z),b=P(x2,y1,z);ctx.fillStyle=col;ctx.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1])}

function drawSky(){
  let g=ctx.createLinearGradient(0,0,0,HY);g.addColorStop(0,'#2b1650');g.addColorStop(.7,'#c4556a');g.addColorStop(1,'#ffb26b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HY+2);
  ctx.fillStyle='#ffe3a3';ctx.beginPath();ctx.arc(W/2,HY-H*.05,W*.15,0,7);ctx.fill();
  ctx.fillStyle='#2a1440';
  for(let i=0;i<5;i++){const w=W*.22-i*W*.04;ctx.fillRect(W/2-w,HY-(i+1)*H*.016,2*w,H*.016+1)}
  ctx.fillRect(W/2-W*.03,HY-H*.1,W*.06,H*.02);
  ctx.beginPath();ctx.moveTo(0,HY);ctx.lineTo(W*.15,HY-H*.04);ctx.lineTo(W*.35,HY);ctx.moveTo(W*.65,HY);ctx.lineTo(W*.85,HY-H*.05);ctx.lineTo(W,HY);ctx.fill();
}
function drawWorld(){
  ctx.fillStyle='#2a6034';ctx.fillRect(0,HY,W,H-HY);
  poly([P(-1.5,0,-1.5),P(1.5,0,-1.5),P(1.5,0,ZF+1),P(-1.5,0,ZF+1)],'#0c0715');
  const off=dist%1,k0=Math.floor(dist),gaps=objs.filter(o=>o.t==='gap');
  for(let i=ZF;i>=-2;i--){
    const z1=Math.max(i-off,-1.5),z2=i+1-off;if(z2<=z1)continue;
    const k=k0+i,a=k%2===0;
    strip(-40,-1.5,z1,z2,a?'#2f6b3a':'#285c31');strip(1.5,40,z1,z2,a?'#2f6b3a':'#285c31');
    const mid=k+.5;if(gaps.some(g=>g.z<=mid&&mid<g.z+g.len))continue;
    strip(-1.5,1.5,z1,z2,a?'#c9a26b':'#bd9660');
    strip(-1.65,-1.5,z1,z2,'#6b5a45');strip(1.5,1.65,z1,z2,'#6b5a45');
  }
  const f=ctx.createLinearGradient(0,HY,0,HY+H*.16);f.addColorStop(0,'rgba(255,178,107,.9)');f.addColorStop(1,'rgba(255,178,107,0)');
  ctx.fillStyle=f;ctx.fillRect(0,HY,W,H*.16);
}
function items(){
  const a=[];
  for(let z=Math.ceil(dist/3)*3,n=Math.ceil(dist/3);z<dist+ZF;z+=3,n++){
    const h=2.4+((n*37)%10)/10*1.6;
    a.push({t:n%5===0?'pillar':'tree',x:-2.9-((n*13)%5)*.3,z,h});
    a.push({t:n%7===0?'pillar':'tree',x:2.9+((n*29)%5)*.3,z:z+1.5,h});
  }
  for(const o of objs)if(o.t!=='gap'&&!(o.t==='coin'&&o.got))a.push(o);
  return a.filter(o=>o.z-dist>-1).sort((p,q)=>q.z-p.z);
}
function drawItem(o){
  const z=o.z-dist;
  if(z+Z0<.5)return;
  ctx.globalAlpha=Math.max(0,Math.min(1,(ZF-z)/10));
  if(o.t==='tree'||o.t==='pillar'){
    const b=P(o.x,0,z),s=b[2];
    if(o.t==='tree'){rectP(o.x-.18,0,o.x+.18,o.h*.7,z,'#4a2f1a');
      const c=P(o.x,o.h,z);ctx.fillStyle='#1d4a2a';ctx.beginPath();ctx.arc(c[0],c[1],1.05*s,0,7);ctx.fill();
      ctx.fillStyle='#2a6a3a';ctx.beginPath();ctx.arc(c[0]-.3*s,c[1]-.25*s,.6*s,0,7);ctx.fill()}
    else{rectP(o.x-.35,0,o.x+.35,2.4,z,'#8a8478');rectP(o.x-.45,2.4,o.x+.45,2.7,z,'#a8a294');rectP(o.x-.05,.3,o.x+.05,2.1,z,'#6e685d')}
  }else if(o.t==='coin'){
    const p=P(o.l,o.h,z),w=Math.abs(Math.cos(time*5+o.z))*.22+.04;
    ctx.fillStyle='#ffc933';ctx.beginPath();ctx.ellipse(p[0],p[1],w*p[2],.22*p[2],0,0,7);ctx.fill();
    ctx.strokeStyle='#b8860b';ctx.lineWidth=Math.max(1,.03*p[2]);ctx.stroke();
  }else if(o.t==='block'){
    const x1=o.l-.4,x2=o.l+.4,zf=z+.7,hh=.9;
    if(x1-camX>0)poly([P(x1,0,z),P(x1,0,zf),P(x1,hh,zf),P(x1,hh,z)],'#6e685d');
    if(x2-camX<0)poly([P(x2,0,z),P(x2,0,zf),P(x2,hh,zf),P(x2,hh,z)],'#6e685d');
    poly([P(x1,hh,z),P(x2,hh,z),P(x2,hh,zf),P(x1,hh,zf)],'#aaa496');
    rectP(x1,0,x2,hh,z,'#8a8478');rectP(x1+.1,hh*.45,x2-.1,hh*.55,z,'#6e685d');rectP(x1+.2,hh*.7,x2-.2,hh*.78,z,'#9b9588');
  }else if(o.t==='beam'){
    rectP(-1.65,0,-1.4,1.3,z,'#5a3318');rectP(1.4,0,1.65,1.3,z,'#5a3318');
    rectP(-1.65,.75,1.65,1.2,z,'#7b4a22');rectP(-1.65,.75,1.65,.82,z,'#4b2a12');
    for(let i=-1;i<=1;i+=1)rectP(i*.9-.12,.82,i*.9+.12,1.15,z,'#d9552b');
  }
  ctx.globalAlpha=1;
}
function drawPlayer(){
  const u=S,sx=W/2+(px-camX)*u,ground=HY+CAMH*u,gy=ground-py*u;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(sx,ground,.4*u*(1-Math.min(.5,py*.25)),.12*u,0,0,7);ctx.fill();
  ctx.save();ctx.translate(sx,gy);
  const sl=slide>0&&py<=0.05;
  if(sl)ctx.scale(1.15,.55);
  ctx.lineCap='round';
  const air=py>.05;
  const ph=k=>Math.sin(runT+(k>0?0:Math.PI));
  for(const k of[-1,1]){
    const lift=air?(k>0?.35:.1):Math.max(0,ph(k))*.3;
    ctx.strokeStyle='#3b2a1f';ctx.lineWidth=.17*u;ctx.beginPath();ctx.moveTo(k*.11*u,-.85*u);ctx.lineTo(k*.11*u,-lift*u-.05*u);ctx.stroke();
    ctx.fillStyle='#1d1410';ctx.beginPath();ctx.ellipse(k*.11*u,-lift*u,.12*u,.06*u,0,0,7);ctx.fill();
  }
  ctx.fillStyle='#d9552b';ctx.beginPath();ctx.roundRect(-.29*u,-1.5*u,.58*u,.72*u,.1*u);ctx.fill();
  ctx.fillStyle='#7a4b22';ctx.beginPath();ctx.roundRect(-.2*u,-1.42*u,.4*u,.5*u,.07*u);ctx.fill();
  ctx.fillStyle='#a06a34';ctx.fillRect(-.2*u,-1.3*u,.4*u,.05*u);
  for(const k of[-1,1]){
    const sw=air?-.6:-ph(k)*.28;
    ctx.strokeStyle='#e8b48a';ctx.lineWidth=.13*u;ctx.beginPath();ctx.moveTo(k*.33*u,-1.4*u);ctx.lineTo(k*.4*u,(-1.0+sw)*u);ctx.stroke();
  }
  ctx.fillStyle='#e8b48a';ctx.beginPath();ctx.arc(0,-1.68*u,.2*u,0,7);ctx.fill();
  ctx.fillStyle='#3b2312';ctx.beginPath();ctx.arc(0,-1.68*u,.2*u,Math.PI*.95,Math.PI*2.05);ctx.fill();
  ctx.fillStyle='#6b4423';ctx.beginPath();ctx.ellipse(0,-1.8*u,.34*u,.07*u,0,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(0,-1.8*u,.17*u,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle='#d9552b';ctx.fillRect(-.17*u,-1.84*u,.34*u,.04*u);
  ctx.restore();
}
function render(){
  drawSky();drawWorld();
  const a=items();
  for(const o of a)if(o.z-dist>=0)drawItem(o);
  drawPlayer();
  for(const o of a)if(o.z-dist<0)drawItem(o);
  $('sc').textContent=Math.floor(dist)+coins*10+' m';$('co').textContent='🪙 '+coins;
}

function left(){if(st==='play')lane=Math.max(-1,lane-1)}
function right(){if(st==='play')lane=Math.min(1,lane+1)}
function jump(){if(st==='play'&&py===0){vy=9;slide=0}}
function down(){if(st!=='play')return;if(py>0)vy=-14;else slide=.6}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')left();else if(k==='arrowright'||k==='d')right();
  else if(k==='arrowup'||k==='w'||k===' ')jump();else if(k==='arrowdown'||k==='s')down();
  else if(k==='enter'&&st!=='play')start();
  if(k.startsWith('arrow')||k===' ')e.preventDefault();
});
let t0=null;
addEventListener('touchstart',e=>{const t=e.touches[0];t0={x:t.clientX,y:t.clientY,done:false}},{passive:true});
addEventListener('touchmove',e=>{
  if(!t0||t0.done)return;const t=e.touches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;
  t0.done=true;
  if(Math.abs(dx)>Math.abs(dy))dx<0?left():right();else dy<0?jump():down();
},{passive:true});
addEventListener('touchend',()=>{if(t0&&!t0.done)jump();t0=null});

let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;time+=dt;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
